name: Automated MindAR Compiler
on:
  push:
    paths:
      - 'target-*.jpg'
      - 'target-*.jpeg'

jobs:
  build-tracking-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Process Target Image Arrays
        run: |
          echo "System: Installing MindAR Compiler Tools..."
          # Install the explicit standalone compiler utility
          npm install -g mind-ar@1.2.5
          
          echo "System: Scanning studio raw targets..."
          # Gather all target files into a space-separated string array
          IMAGES=$(ls target-*.jpg target-*.jpeg 2>/dev/null | tr '\n' ' ' || true)
          # Clean trailing spaces
          IMAGES=$(echo "$IMAGES" | xargs)
          
          if [ -z "$IMAGES" ]; then
            echo "Error: No matching raw images found to process."
            exit 1
          fi
          
          echo "Compiling tracking vectors for targets: $IMAGES"
          # Run the absolute direct path binary execution for the compiler
          npx mindar-image-compile "$IMAGES" targets.mind

      - name: Commit Compiled Matrix Back to Main
        run: |
          git config --global user.name "Studio Automation"
          git config --global user.email "studio-bot@github.com"
          
          # Force add the file to ensure tracking updates register cleanly
          git add -f targets.mind
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated ledger indexing for tracking matrices [skip ci]"
            git push origin main
          else
            echo "No matrix updates required."
          fi
