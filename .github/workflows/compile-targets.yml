name: Automated MindAR Compiler
on:
  push:
    paths:
      - 'target-*.jpg'
      - 'target-*.jpeg'

jobs:
  build-tracking-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Process Target Image Arrays
        run: |
          echo "System: Installing MindAR Compiler Tools..."
          # Install the official standalone image compiler CLI tool
          npm install -g mind-ar@1.2.5
          
          echo "System: Scanning studio raw targets..."
          # Find all matching target images uploaded via dashboard
          IMAGES=$(ls target-*.jpg target-*.jpeg 2>/dev/null || true)
          
          if [ -z "$IMAGES" ]; then
            echo "Error: No matching raw images present."
            exit 1
          fi
          
          echo "Compiling tracking vectors for: $IMAGES"
          # Compile images straight into the main targets.mind tracking file
          npx mindar-image-compile $IMAGES targets.mind

      - name: Commit Compiled Matrix Back to Main
        run: |
          git config --global user.name "Studio Automation"
          git config --global user.email "studio-bot@github.com"
          git add targets.mind
          
          # Safely check if files changed before committing to prevent empty loops
          if ! git diff --cached --quiet; then
            git commit -m "Automated ledger indexing for tracking matrices [skip ci]"
            git push
          else
            echo "No matrix updates required."
          fi
