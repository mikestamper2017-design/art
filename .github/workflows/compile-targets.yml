name: Automated MindAR Compiler
on:
  push:
    paths:
      - 'target-*'

jobs:
  build-tracking-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Process Target Image Arrays
        run: |
          echo "System: Installing MindAR Compiler Tools..."
          npm install -g mind-ar@1.2.5
          
          echo "System: Detecting all target images..."
          # Find all target files matching the pattern explicitly
          FILES=$(ls target-* 2>/dev/null || true)
          
          if [ -z "$FILES" ]; then
            echo "Error: No matching raw images present."
            exit 1
          fi
          
          # Convert newline list to space separated string cleanly
          IMAGES_LIST=$(echo "$FILES" | tr '\n' ' ')
          echo "Compiling tracking vectors for: $IMAGES_LIST"
          
          # Pass the clean string directly into the compiler tool without quotes
          npx mindar-image-compile $IMAGES_LIST targets.mind

      - name: Commit Compiled Matrix Back to Main
        run: |
          git config --global user.name "Studio Automation"
          git config --global user.email "studio-bot@github.com"
          
          # Force track the targets.mind compiled asset binary
          git add -f targets.mind
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated ledger indexing for tracking matrices [skip ci]"
            git push origin main
          else
            echo "No matrix updates required."
          fi
