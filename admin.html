<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Registry - Streamlined Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; margin: 0; padding: 40px 20px; color: #111; }
    .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; margin-top: 0; margin-bottom: 6px; }
    p.subtitle { color: #666; font-size: 14px; margin: 0 0 24px 0; line-height: 1.4; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; color: #444; }
    input[type='text'], textarea, input[type='password'] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 90px; resize: vertical; }
    .file-input-wrapper { background: #fafafa; border: 1px dashed #ccc; padding: 16px; border-radius: 6px; text-align: center; cursor: pointer; position: relative; }
    .file-input-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .btn { background: #000; color: #fff; border: none; width: 100%; padding: 14px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
    .btn:disabled { background: #999; cursor: not-allowed; }
    #status-sheet { padding: 14px; border-radius: 6px; font-size: 13px; font-weight: 500; margin-top: 20px; display: none; line-height: 1.5; }
    .status-processing { background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; }
    .status-success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    .status-error { background: #ffebee; color: #b71c1c; border: 1px solid #ffcdd2; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Studio Registry</h1>
    <p class="subtitle">Publish new works directly to the repository. The background compiler will generate the tracking matrix automatically.</p>
    
    <div class="form-group">
      <label>GitHub Access Token</label>
      <input type="password" id="gh-token" placeholder="Paste authentication key...">
    </div>

    <div class="form-group">
      <label>Artwork Title</label>
      <input type="text" id="art-title" placeholder="e.g., Twin Pines">
    </div>

    <div class="form-group">
      <label>Medium / Subtext</label>
      <input type="text" id="art-subtext" placeholder="e.g., Acrylic on Canvas">
    </div>

    <div class="form-group">
      <label>Provenance Narrative Documentation</label>
      <textarea id="art-provenance" placeholder="Describe canvas history layers..."></textarea>
    </div>

    <div class="form-group">
      <label>Target Tracking Image File (.JPG / .JPEG)</label>
      <div class="file-input-wrapper">
        <span id="label-image">Select Raw Target Image</span>
        <input type="file" id="file-target" accept="image/jpeg, image/jpg" onchange="updateFileLabel('file-target', 'label-image')">
      </div>
    </div>

    <div class="form-group">
      <label>Video Layer Overlay (.MP4 / .MOV)</label>
      <div class="file-input-wrapper">
        <span id="label-video">Select Motion Asset</span>
        <input type="file" id="file-video" accept="video/mp4, video/quicktime" onchange="updateFileLabel('file-video', 'label-video')">
      </div>
    </div>

    <button id="submit-btn" class="btn" onclick="processStudioUpload()">Publish to Immersive Gallery</button>
    <div id="status-sheet"></div>
  </div>

  <script>
    const GITHUB_USER = "mikestamper2017-design";
    const GITHUB_REPO = "art";

    function updateFileLabel(inputId, labelId) {
      const file = document.getElementById(inputId).files[0];
      document.getElementById(labelId).innerText = file ? file.name : "Select File";
    }

    function showStatus(msg, type) {
      const box = document.getElementById('status-sheet');
      box.innerText = msg;
      box.className = `status-${type}`;
      box.style.display = 'block';
    }

    async function processStudioUpload() {
      const token = document.getElementById('gh-token').value.trim();
      const title = document.getElementById('art-title').value.trim();
      const subtext = document.getElementById('art-subtext').value.trim();
      const provenance = document.getElementById('art-provenance').value.trim();
      const targetFile = document.getElementById('file-target').files[0];
      const videoFile = document.getElementById('file-video').files[0];
      const btn = document.getElementById('submit-btn');

      if (!token || !title || !targetFile || !videoFile) {
        showStatus("Please ensure all parameters and files are assigned.", "error");
        return;
      }

      btn.disabled = true;
      const assetSlug = title.toLowerCase().replace(/[^a-z0-9]/g, "-");
      
      // Force consistent file extensions for the background action script
      const videoExt = videoFile.name.toLowerCase().endsWith('.mov') ? 'mov' : 'mp4';
      const videoName = `video-${assetSlug}.${videoExt}`;
      const imageName = `target-${assetSlug}.jpg`;

      try {
        showStatus("Encoding files for transfer...", "processing");
        const videoBase64 = await convertFileToBase64(videoFile);
        const imageBase64 = await convertFileToBase64(targetFile);

        showStatus(`Streaming motion layer: ${videoName}...`, "processing");
        await pushFileToGitHub(token, videoName, videoBase64, `Upload video layer for ${title}`);

        showStatus(`Streaming tracking snapshot target: ${imageName}...`, "processing");
        await pushFileToGitHub(token, imageName, imageBase64, `Upload image target for ${title}`);

        showStatus("Writing details to main registry ledger database...", "processing");
        await appendRecordToLedger(token, { title, subtext, provenance, image: imageName, video: videoName });

        showStatus("Successfully uploaded! The background compilation script has been triggered. Wait 15 seconds, clear Safari cache, and test your viewer.", "success");
        document.getElementById('art-title').value = '';
        document.getElementById('art-subtext').value = '';
        document.getElementById('art-provenance').value = '';
      } catch (err) {
        showStatus(`Upload Error: ${err.message}`, "error");
      } finally {
        btn.disabled = false;
      }
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function pushFileToGitHub(token, filename, base64Content, commitMsg) {
      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filename}`;
      let sha = null;
      try {
        const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (res.ok) { const data = await res.json(); sha = data.sha; }
      } catch (e) {}

      const body = { message: commitMsg, content: base64Content };
      if (sha) body.sha = sha;

      const res = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`Failed to transmit file: ${filename}`);
    }

    async function appendRecordToLedger(token, newArtwork) {
      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/artworks.json`;
      let sha = null;
      let inventory = [];

      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (res.ok) {
        const data = await res.json();
        sha = data.sha;
        inventory = JSON.parse(atob(data.content));
      }

      inventory.push(newArtwork);
      const updatedBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(inventory, null, 2))));

      const putRes = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `Automated ledger indexing for: ${newArtwork.title}`, content: updatedBase64, sha })
      });
      if (!putRes.ok) throw new Error("Central ledger entry update transaction rejected.");
    }
  </script>
</body>
</html>
