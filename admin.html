<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Registry - Automated AR Compiler Dashboard</title>
  
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-compiler.prod.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; margin: 0; padding: 40px 20px; color: #111; }
    .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; margin-top: 0; margin-bottom: 6px; }
    p.subtitle { color: #666; font-size: 14px; margin: 0 0 24px 0; line-height: 1.4; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; color: #444; }
    input[type='text'], textarea, input[type='password'] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 90px; resize: vertical; }
    .file-input-wrapper { background: #fafafa; border: 1px dashed #ccc; padding: 16px; border-radius: 6px; text-align: center; cursor: pointer; position: relative; }
    .file-input-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .btn { background: #000; color: #fff; border: none; width: 100%; padding: 14px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; transition: background 0.2s ease; }
    .btn:disabled { background: #999; cursor: not-allowed; }
    
    #status-sheet { padding: 14px; border-radius: 6px; font-size: 13px; font-weight: 500; margin-top: 20px; display: none; line-height: 1.5; }
    .status-processing { background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; }
    .status-success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    .status-error { background: #ffebee; color: #b71c1c; border: 1px solid #ffcdd2; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Studio Registry</h1>
    <p class="subtitle">Upload artwork parameters. The background compiler builds tracking vectors directly from your canvas photo instantly.</p>
    
    <div class="form-group">
      <label>GitHub Access Token</label>
      <input type="password" id="gh-token" placeholder="Paste security variable identifier keys...">
    </div>

    <div class="form-group">
      <label>Artwork Title</label>
      <input type="text" id="art-title" placeholder="e.g., Twin Pines">
    </div>

    <div class="form-group">
      <label>Medium / Subtext</label>
      <input type="text" id="art-subtext" placeholder="e.g., Acrylic on Canvas">
    </div>

    <div class="form-group">
      <label>Provenance Narrative Documentation</label>
      <textarea id="art-provenance" placeholder="Describe historical, thematic registry markers..."></textarea>
    </div>

    <div class="form-group">
      <label>Target Tracking Image File (.JPG Only)</label>
      <div class="file-input-wrapper">
        <span id="label-image">Select Raw Target Image</span>
        <input type="file" id="file-target" accept="image/jpeg, image/jpg" onchange="updateFileLabel('file-target', 'label-image')">
      </div>
    </div>

    <div class="form-group">
      <label>Video Layer Overlay (.MP4 Only)</label>
      <div class="file-input-wrapper">
        <span id="label-video">Select Motion Asset</span>
        <input type="file" id="file-video" accept="video/mp4" onchange="updateFileLabel('file-video', 'label-video')">
      </div>
    </div>

    <button id="submit-btn" class="btn" onclick="processStudioUpload()">Publish to Immersive Gallery</button>
    
    <div id="status-sheet"></div>
  </div>

  <script>
    const GITHUB_USER = "mikestamper2017-design";
    const GITHUB_REPO = "art";

    function updateFileLabel(inputId, labelId) {
      const file = document.getElementById(inputId).files[0];
      document.getElementById(labelId).innerText = file ? file.name : "Select File";
    }

    function showStatus(msg, type) {
      const box = document.getElementById('status-sheet');
      box.innerText = msg;
      box.className = `status-${type}`;
      box.style.display = 'block';
    }

    async function processStudioUpload() {
      const token = document.getElementById('gh-token').value.trim();
      const title = document.getElementById('art-title').value.trim();
      const subtext = document.getElementById('art-subtext').value.trim();
      const provenance = document.getElementById('art-provenance').value.trim();
      const targetFile = document.getElementById('file-target').files[0];
      const videoFile = document.getElementById('file-video').files[0];
      const btn = document.getElementById('submit-btn');

      if (!token || !title || !targetFile || !videoFile) {
        showStatus("Please ensure token, title, and both structural files are allocated.", "error");
        return;
      }

      btn.disabled = true;
      const assetSlug = title.toLowerCase().replace(/[^a-z0-9]/g, "-");
      const videoName = `video-${assetSlug}.mp4`;
      const imageName = `target-${assetSlug}.jpg`;

      try {
        // Step 1: Initialize local in-browser compilation mechanics
        showStatus("Phase 1: Local compiler active. Analyzing and mapping canvas image contours...", "processing");
        const newTargetData = await compileImageToTargetData(targetFile);

        // Step 2: Download existing targets.mind array map to prevent wiping old data rows
        showStatus("Phase 2: Syncing with existing global tracking files...", "processing");
        const currentMindBuffer = await fetchExistingMindBuffer(token);
        
        let finalMindBuffer;
        const compiler = new window.MINDAR.IMAGE.Compiler();

        if (currentMindBuffer) {
          showStatus("Phase 3: Merging new artwork tracking indices into master archive array...", "processing");
          // Import previous targets, append the fresh image calculation data, and bundle
          const imageList = compiler.importData(currentMindBuffer);
          imageList.push(newTargetData[0]); 
          finalMindBuffer = compiler.exportData(imageList);
        } else {
          showStatus("Phase 3: Creating pristine master tracking database file...", "processing");
          finalMindBuffer = compiler.exportData(newTargetData);
        }

        // Step 4: Convert assets to clean base64 data streams
        showStatus("Phase 4: Structuring binary asset upload payloads...", "processing");
        const videoBase64 = await convertFileToBase64(videoFile);
        const imageBase64 = await convertFileToBase64(targetFile);
        const mindBase64 = btoa(String.fromCharCode(...new Uint8Array(finalMindBuffer)));

        // Step 5: Upload media layers
        showStatus(`Phase 5: Uploading motion layer overlay: ${videoName}...`, "processing");
        await pushFileToGitHub(token, videoName, videoBase64, `Upload video layer for ${title}`);

        showStatus(`Phase 6: Uploading reference image canvas snapshot: ${imageName}...`, "processing");
        await pushFileToGitHub(token, imageName, imageBase64, `Upload tracking reference for ${title}`);

        // Step 6: Overwrite global targets.mind compilation mapping index file
        showStatus("Phase 7: Saving updated tracking vector ledger maps (.mind)...", "processing");
        await pushFileToGitHub(token, "targets.mind", mindBase64, `Append compiled tracking profile index mappings for ${title}`);

        // Step 7: Update textual metadata JSON registry ledger record data
        showStatus("Phase 8: Recording metadata fields to central gallery database...", "processing");
        await appendRecordToLedger(token, { title, subtext, provenance, image: imageName, video: videoName });

        showStatus("Gallery profile successfully compiled and published! Give GitHub 60 seconds to deploy, then clear your Safari cache and test.", "success");
        document.getElementById('art-title').value = '';
        document.getElementById('art-subtext').value = '';
        document.getElementById('art-provenance').value = '';
        document.getElementById('file-target').value = '';
        document.getElementById('file-video').value = '';
        document.getElementById('label-image').innerText = "Select Raw Target Image";
        document.getElementById('label-video').innerText = "Select Motion Asset";
      } catch (err) {
        showStatus(`Compilation Fault: ${err.message}`, "error");
      } finally {
        btn.disabled = false;
      }
    }

    // Leverages standalone compiler plugin window space scripts
    function compileImageToTargetData(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
          try {
            // Instantiate correct constructor pulled down from compiler dependency file
            const compiler = new window.MINDAR.IMAGE.Compiler();
            const trackingData = await compiler.compileImageTargets([img], (progress) => {
              showStatus(`Phase 1: Surface vector compilation: ${Math.round(progress)}%`, "processing");
            });
            resolve(trackingData);
          } catch (e) { reject(e); }
        };
        img.onerror = () => reject(new Error("Failed to map graphic image contours. Image file might be corrupted."));
      });
    }

    async function fetchExistingMindBuffer(token) {
      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/targets.mind`;
      try {
        const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (res.ok) {
          const data = await res.json();
          const binaryString = atob(data.content);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          return bytes.buffer;
        }
      } catch (e) {}
      return null;
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function pushFileToGitHub(token, filename, base64Content, commitMsg) {
      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filename}`;
      let sha = null;

      try {
        const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (res.ok) {
          const data = await res.json();
          sha = data.sha;
        }
      } catch (e) {}

      const body = { message: commitMsg, content: base64Content };
      if (sha) body.sha = sha;

      const res = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`Repository upload block encountered for asset profile: ${filename}`);
    }

    async function appendRecordToLedger(token, newArtwork) {
      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/artworks.json`;
      let sha = null;
      let inventory = [];

      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (res.ok) {
        const data = await res.json();
        sha = data.sha;
        inventory = JSON.parse(atob(data.content));
      }

      inventory.push(newArtwork);
      const updatedBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(inventory, null, 2))));

      const putRes = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `Automated ledger indexing for: ${newArtwork.title}`, content: updatedBase64, sha })
      });
      if (!putRes.ok) throw new Error("Central JSON database transactions denied.");
    }
  </script>
</body>
</html>
