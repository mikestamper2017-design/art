<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Registry — Artwork Management Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; margin: 0; padding: 40px 20px; color: #111; }
    .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 16px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #555; margin-bottom: 6px; }
    input[type="text"], textarea, input[type="password"] { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    textarea { height: 100px; resize: vertical; }
    .btn { background: #000; color: #fff; border: none; width: 100%; padding: 14px; font-size: 15px; font-weight: 500; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn:hover { background: #222; }
    #status-msg { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; text-align: center; line-height: 1.4; }
    .success { background: #e2f6ea; color: #137e3d; }
    .error { background: #fde8e8; color: #c81e1e; }
  </style>
</head>
<body>

<div class="container">
  <h1>Studio Registry</h1>
  <p style="color:#666; font-size:14px; margin-top:-10px; margin-bottom:24px;">Upload new artwork targets and video overlays straight to your gallery.</p>
  
  <div class="form-group">
    <label>GitHub Access Token</label>
    <input type="password" id="gh-token" placeholder="Paste your classic secret token here">
  </div>
  
  <hr style="border:0; border-top:1px solid #eee; margin:24px 0;">

  <div class="form-group">
    <label>Artwork Title</label>
    <input type="text" id="art-title" placeholder="e.g., Abstract Geometries">
  </div>

  <div class="form-group">
    <label>Medium / Subtext</label>
    <input type="text" id="art-subtext" placeholder="e.g., Hand-Carved Canadian Soapstone">
  </div>

  <div class="form-group">
    <label>Provenance Narrative Documentation</label>
    <textarea id="art-provenance" placeholder="Describe the background story and creation process details..."></textarea>
  </div>

  <div class="form-group">
    <label>Target Tracking Image File (.jpg only)</label>
    <input type="file" id="file-target" accept="image/jpeg">
  </div>

  <div class="form-group">
    <label>Video Layer Overlay (.mp4 only)</label>
    <input type="file" id="file-video" accept="video/mp4">
  </div>

  <button class="btn" onclick="processStudioUpload()">Publish to Immersive Gallery</button>
  
  <div id="status-msg"></div>
</div>

<script>
  // Tailored User Parameters
  const GITHUB_USER = "mikestamper2017"; 
  const GITHUB_REPO = "art"; // Points directly to the destination repository name

  async function processStudioUpload() {
    const token = document.getElementById('gh-token').value.trim();
    const title = document.getElementById('art-title').value.trim();
    const subtext = document.getElementById('art-subtext').value.trim();
    const provenance = document.getElementById('art-provenance').value.trim();
    const targetFile = document.getElementById('file-target').files[0];
    const videoFile = document.getElementById('file-video').files[0];
    
    if(!token || !title || !targetFile || !videoFile) {
      showStatus("Please complete all required fields and insert your security token.", "error");
      return;
    }

    showStatus("Initializing asset compilation payload...", "success");

    try {
      const assetSlug = title.toLowerCase().replace(/[^a-z0-9]/g, "-");
      const videoName = `video-${assetSlug}.mp4`;
      const imageName = `target-${assetSlug}.jpg`;

      const targetBase64 = await convertFileToBase64(targetFile);
      const videoBase64 = await convertFileToBase64(videoFile);

      // 1. Send Video file to GitHub
      showStatus(`Processing Stream: Uploading ${videoName}...`, "success");
      await uploadToGitHub(token, videoName, videoBase64, `Upload video overlay for ${title}`);

      // 2. Send Image file to GitHub
      showStatus(`Processing Stream: Uploading ${imageName}...`, "success");
      await uploadToGitHub(token, imageName, targetBase64, `Upload tracking image for ${title}`);

      // 3. Download, modify, and push updated artworks.json ledger
      showStatus("Synchronizing studio ledger database (artworks.json)...", "success");
      await updateLedgerDatabase(token, {
        title: title,
        subtext: subtext,
        provenance: provenance,
        image: imageName,
        video: videoName
      });

      showStatus("Gallery entry published completely! Give GitHub Pages 60 seconds to compile, then refresh your app.", "success");
    } catch (err) {
      showStatus(`Transmission Fault: ${err.message}`, "error");
    }
  }

    function convertFileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      // Slices off the "data:image/jpeg;base64," or "data:video/mp4;base64," headers cleanly
      reader.onload = () => resolve(reader.result.split(',')[1]); 
      reader.onerror = error => reject(error);
    });
  }


  async function uploadToGitHub(token, filename, base64Content, commitMessage) {
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filename}`;
    let sha = null;
    try {
      const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (res.ok) { const data = await res.json(); sha = data.sha; }
    } catch(e) {}

    const body = { message: commitMessage, content: base64Content };
    if (sha) body.sha = sha;

    const response = await fetch(url, {
      method: "PUT",
      headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if(!response.ok) throw new Error("Asset transfer rejected by GitHub file system parameters.");
  }

  async function updateLedgerDatabase(token, newArtworkObj) {
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/artworks.json`;
    
    const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
    if(!res.ok) throw new Error("Ledger database file (artworks.json) missing from repository root.");
    
    const fileData = await res.json();
    const currentLedger = JSON.parse(atob(fileData.content));
    
    // Append the newly created artwork object array to the ledger
    currentLedger.push(newArtworkObj);
    
    const updatedBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentLedger, null, 2))));
    
    const response = await fetch(url, {
      method: "PUT",
      headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Automated inventory addition: ${newArtworkObj.title}`,
        content: updatedBase64,
        sha: fileData.sha
      })
    });
    if(!response.ok) throw new Error("Failed to write updates to studio ledger schema file.");
  }

  function showStatus(text, type) {
    const box = document.getElementById('status-msg');
    box.innerText = text;
    box.className = type;
    box.style.display = 'block';
  }
</script>
</body>
</html>
