<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mike Stamper - Immersive Fine Art Archive</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #ar-viewport { width: 100vw; height: 70vh; position: relative; background-color: #000; }
    
    /* Premium Intro Gatekeeper screen bypassing iOS autoplay/interaction blocks */
    #ios-gatekeeper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    .gatekeeper-title { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }
    .gatekeeper-sub { font-size: 14px; color: #666; margin-bottom: 32px; max-width: 280px; line-height: 1.5; }
    .gatekeeper-btn { background: #000; color: #fff; border: none; padding: 16px 32px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }

    /* UI Overlay elements */
    .tracking-indicator { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; z-index: 100; pointer-events: none; }
    #media-dock { width: 100vw; height: 30vh; position: relative; background-color: #ffffff; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); border-top: 1px solid #e5e5e7; z-index: 100; box-sizing: border-box; }
    .meta-block { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 24px; box-sizing: border-box; }
    .art-title { font-size: 18px; font-weight: 600; color: #111; margin: 0 0 4px 0; }
    .art-sub { font-size: 13px; color: #666; margin: 0; }
    .tabs-wrapper { display: flex; gap: 12px; margin-top: 16px; }
    .tab-btn { flex: 1; padding: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-radius: 6px; cursor: pointer; text-align: center; border: 1px solid #000; transition: all 0.2s ease; }
    .btn-active { background: #000; color: #fff; }
    .btn-inactive { background: #fff; color: #000; }
    #provenance-panel { display: none; font-size: 13px; color: #444; line-height: 1.6; margin-top: 12px; max-height: 80px; overflow-y: auto; }
  </style>
</head>
<body>

  <div id="ios-gatekeeper">
    <div class="gatekeeper-title">Studio Showcase</div>
    <div class="gatekeeper-sub">Tap below to authorize camera tracking layers and enter the live archive.</div>
    <button class="gatekeeper-btn" onclick="initializeStudioExperience()">Start Scanning</button>
  </div>

  <div id="ar-viewport">
    <div class="tracking-indicator" id="scan-badge">System: Initializing...</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes;" 
             embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets id="asset-library">
        </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-anchor-0" mindar-image-target="targetIndex: 0">
         <a-video id="ar-video-player" src="" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>
  </div>

  <div id="media-dock">
    <div class="meta-block">
      <div>
        <h2 class="art-title" id="display-title">Scanning System Ready</h2>
        <p class="art-sub" id="display-sub">Align lens frame directly over physical painting surface.</p>
        <div id="provenance-panel"></div>
      </div>
      <div class="tabs-wrapper">
        <button id="tab-media" class="tab-btn btn-active" onclick="switchDockTab('media')">Live Media</button>
        <button id="tab-prov" class="tab-btn btn-inactive" onclick="switchDockTab('prov')">Provenance</button>
      </div>
    </div>
  </div>

  <script>
    let registryData = [];
    let currentVideoEl = null;

    // Load ledger dynamically to align metadata with tracked target matrices
    async function loadGalleryLedger() {
      try {
        const response = await fetch('./artworks.json?cb=' + Date.now());
        if (response.ok) {
          registryData = await response.json();
          preloadMediaAssets();
        }
      } catch (err) {
        console.error("Ledger communication synchronization breakdown:", err);
      }
    }

    function preloadMediaAssets() {
      const library = document.getElementById('asset-library');
      registryData.forEach((artwork, index) => {
        if (index === 0) { // Mapping active focus to your current compiled matrix index
          const video = document.createElement('video');
          video.setAttribute('id', `source-video-${index}`);
          video.setAttribute('src', `./${artwork.video}`);
          video.setAttribute('preload', 'auto');
          video.setAttribute('loop', 'true');
          video.setAttribute('crossorigin', 'anonymous');
          video.setAttribute('playsinline', 'true');
          video.setAttribute('webkit-playsinline', 'true');
          library.appendChild(video);
          
          // Connect preloaded element straight to our AR viewport mesh frame
          document.getElementById('ar-video-player').setAttribute('src', `#source-video-${index}`);
          currentVideoEl = video;
        }
      });
    }

    function initializeStudioExperience() {
      document.getElementById('ios-gatekeeper').style.display = 'none';
      document.getElementById('scan-badge').innerText = "System: Active Scan";

      // Start AR.js pipeline engines directly
      const sceneEl = document.querySelector('a-scene');
      sceneEl.systems['mindar-image-system'].start();

      // Setup tracking matrix event bindings
      const anchor = document.getElementById('target-anchor-0');
      
      anchor.addEventListener("targetFound", () => {
        document.getElementById('scan-badge').innerText = "System: Locked";
        if (registryData[0]) {
          document.getElementById('display-title').innerText = registryData[0].title;
          document.getElementById('display-sub').innerText = registryData[0].subtext;
          document.getElementById('provenance-panel').innerText = registryData[0].provenance || "No custom ledger notes provided.";
        }
        if (currentVideoEl) currentVideoEl.play();
      });

      anchor.addEventListener("targetLost", () => {
        document.getElementById('scan-badge').innerText = "System: Active Scan";
        if (currentVideoEl) currentVideoEl.pause();
      });
    }

    function switchDockTab(targetTab) {
      const panel = document.getElementById('provenance-panel');
      const sub = document.getElementById('display-sub');
      
      if (targetTab === 'prov') {
        document.getElementById('tab-prov').className = "tab-btn btn-active";
        document.getElementById('tab-media').className = "tab-btn btn-inactive";
        panel.style.display = "block";
        sub.style.display = "none";
      } else {
        document.getElementById('tab-media').className = "tab-btn btn-active";
        document.getElementById('tab-prov').className = "tab-btn btn-inactive";
        panel.style.display = "none";
        sub.style.display = "block";
      }
    }

    // Initialize layout settings
    window.addEventListener('DOMContentLoaded', loadGalleryLedger);
  </script>
</body>
</html>
