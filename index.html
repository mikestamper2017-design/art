<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Studio Showcase Archive</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: transparent; }
    #ios-gatekeeper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .gatekeeper-btn { background: #000; color: #fff; border: none; padding: 16px 32px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    .tracking-indicator { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.75); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; z-index: 999; text-transform: uppercase; }
    #media-dock { width: 100vw; height: 28vh; position: fixed; bottom: 0; left: 0; background: #fff; box-shadow: 0 -4px 25px rgba(0,0,0,0.15); border-top: 1px solid #e5e5e7; z-index: 999; padding: 24px; box-sizing: border-box; border-radius: 16px 16px 0 0; }
    .art-title { font-size: 18px; font-weight: 600; margin: 0 0 4px 0; }
    .art-sub { font-size: 13px; color: #666; margin: 0; }
  </style>
</head>
<body>

  <div id="ios-gatekeeper">
    <h1 style="font-size: 24px; margin-bottom: 8px;">Studio Showcase</h1>
    <p style="font-size: 14px; color: #666; margin-bottom: 32px;">Tap below to launch camera tracking.</p>
    <button class="gatekeeper-btn" onclick="initializeAR()">Start Scanning</button>
  </div>

  <div class="tracking-indicator" id="scan-badge">System: Offline</div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: yes;" embedded vr-mode-ui="enabled: false">
    <a-assets>
      <video id="pines-video" src="./video-twin-pines-amazing.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
       <a-video src="#pines-video" position="0 0 0" height="0.75" width="1"></a-video>
    </a-entity>
  </a-scene>

  <div id="media-dock">
    <h2 class="art-title" id="display-title">Scanning System Ready</h2>
    <p class="art-sub" id="display-sub">Align lens frame directly over your physical painting.</p>
  </div>

  <script>
    function initializeAR() {
      document.getElementById('ios-gatekeeper').style.display = 'none';
      document.getElementById('scan-badge').innerText = "System: Active Scan";
      
      const sceneEl = document.querySelector('a-scene');
      sceneEl.systems['mindar-image-system'].start();

      const targetEntity = document.querySelector('[mindar-image-target]');
      const videoEl = document.getElementById('pines-video');

      targetEntity.addEventListener("targetFound", () => {
        document.getElementById('scan-badge').innerText = "System: Locked";
        document.getElementById('display-title').innerText = "Twin Pines Amazing";
        document.getElementById('display-sub').innerText = "Beautiful view from Georgian Bay, Ontario.";
        videoEl.play();
      });

      targetEntity.addEventListener("targetLost", () => {
        document.getElementById('scan-badge').innerText = "System: Active Scan";
        videoEl.pause();
      });
    }
  </script>
</body>
</html>
